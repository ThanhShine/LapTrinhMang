android {
    namespace 'com.example.laptrinhmang'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.laptrinhmang"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BASE_URL", "\"https://api-rms.dau.edu.vn/api/v1/\""
        buildConfigField "Boolean", "USE_MOCK_DATA", "true"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':core:model')
    implementation project(':core:network')
    implementation project(':core:ui')
    implementation project(':feature:account')
    implementation project(':feature:booking')
    implementation project(':feature:approval')
    implementation project(':feature:checkin')
    implementation project(':feature:admin')

    implementation libs.androidx.core.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity.compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    implementation libs.navigation.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.firebase.messaging

    implementation libs.hilt.android
    implementation libs.hilt.navigation.compose
    ksp libs.hilt.compiler

    testImplementation libs.junit
